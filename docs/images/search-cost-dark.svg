<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Line chart: search cost grows linearly to $0.06 at 1,500 repos, then drops to $0.008" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif"><rect width="720" height="340" rx="8" fill="#1a1a19"/><text x="24.0" y="34.0" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start">Cost of one new search vs. number of starred repos</text><text x="24.0" y="56.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">954 tokens × $0.042 per million per scored repo. Repeat searches are free (score cache).</text><line x1="64" y1="284.0" x2="688" y2="284.0" stroke="#383835" stroke-width="1"/><text x="56.0" y="288.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end">$0.00</text><line x1="64" y1="224.6" x2="688" y2="224.6" stroke="#2c2c2a" stroke-width="1"/><text x="56.0" y="228.6" fill="#898781" font-size="11" font-weight="400" text-anchor="end">$0.02</text><line x1="64" y1="165.1" x2="688" y2="165.1" stroke="#2c2c2a" stroke-width="1"/><text x="56.0" y="169.1" fill="#898781" font-size="11" font-weight="400" text-anchor="end">$0.04</text><line x1="64" y1="105.7" x2="688" y2="105.7" stroke="#2c2c2a" stroke-width="1"/><text x="56.0" y="109.7" fill="#898781" font-size="11" font-weight="400" text-anchor="end">$0.06</text><text x="64.0" y="302.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">0</text><text x="188.8" y="302.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">1,000</text><text x="313.6" y="302.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">2,000</text><text x="438.4" y="302.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">3,000</text><text x="563.2" y="302.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">4,000</text><text x="688.0" y="302.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">5,000</text><text x="376.0" y="328.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">starred repos of the user</text><path d="M64.0,284.0 L251.2,105.4 L251.2,260.2 L688.0,260.2 L688.0,284.0 Z" fill="#3987e5" fill-opacity="0.10"/><path d="M64.0,284.0 L251.2,105.4 L251.2,260.2 L688.0,260.2" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="93.5" cy="255.8" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="105.5" y="281.8" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start">236 repos: $0.0095 (measured)</text><circle cx="251.2" cy="105.4" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="261.2" y="109.4" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start">1,500 repos: $0.060 (every repo scored)</text><text x="269.9" y="230.2" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Above FULL_SCAN_LIMIT (1,500): only the top 200</text><text x="269.9" y="246.2" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">keyword matches are scored → $0.008 per search</text></svg>