<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" role="img" aria-label="Stacked bar: fixed overhead, repository metadata and README excerpt tokens per request" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif"><rect width="720" height="210" rx="8" fill="#1a1a19"/><text x="24.0" y="34.0" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start">Where the ~951 input tokens of one Jev request go</text><text x="24.0" y="56.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Mean over 236 repos, query "Python code formatter". The fixed part is sent again for every repo.</text><rect x="24.0" y="96" width="364.8" height="24" fill="#3987e5"/><text x="206.4" y="80.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">519 (55%)</text><rect x="390.8" y="96" width="28.7" height="24" fill="#d95926"/><line x1="405.2" y1="94" x2="405.2" y2="84" stroke="#898781" stroke-width="1"/><text x="405.2" y="80.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">43 (5%)</text><path d="M421.5,96 H692.0 Q696.0,96 696.0,100 V116 Q696.0,120 692.0,120 H421.5 Z" fill="#199e70"/><text x="558.8" y="80.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">388 (41%)</text><rect x="24" y="146" width="12" height="12" rx="3" fill="#3987e5"/><text x="42.0" y="156.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Fixed: question + 4 level descriptions</text><rect x="311.20000000000005" y="146" width="12" height="12" rx="3" fill="#d95926"/><text x="329.2" y="156.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Repository name, description, topics</text><rect x="585.6" y="146" width="12" height="12" rx="3" fill="#199e70"/><text x="603.6" y="156.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">README excerpt</text><text x="24.0" y="194.0" fill="#898781" font-size="11" font-weight="400" text-anchor="start">Source: usage.input_tokens returned by the Jev API, jev-1.13.0, measured 2026-09-24.</text></svg>