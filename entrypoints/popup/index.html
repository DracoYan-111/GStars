<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>GStars</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --accent: #0969da;
        --accent-hover: #0860ca;
        --accent-contrast: #ffffff;
        --notice-bg: #fff8c5;
        --notice-border: #d4a72c;
        --notice-fg: #7a5f00;
        --error-bg: #ffebe9;
        --error-border: #ff8182;
        --error-fg: #d1242c;
        --icon-btn-hover: #eaeef2;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --accent: #4493f8;
          --accent-hover: #58a6ff;
          --accent-contrast: #0d1117;
          --notice-bg: #bb800926;
          --notice-border: #9e6a03;
          --notice-fg: #d4a72c;
          --error-bg: #ffebe926;
          --error-border: #da3633;
          --error-fg: #ff7b72;
          --icon-btn-hover: #21262d;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 12px 14px 14px;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand {
        font-weight: 650;
        font-size: 15px;
        letter-spacing: 0.1px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-btn:hover { background: var(--icon-btn-hover); color: var(--fg); }
      .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .icon-btn svg { width: 17px; height: 17px; }
      form { display: flex; gap: 8px; }
      input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      input::placeholder { color: var(--muted); }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
      button[type="submit"] {
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      @media (prefers-color-scheme: dark) { button[type="submit"] { color: var(--accent-contrast); } }
      button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
      button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; }
      .notice, .fail {
        margin: 10px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
      }
      .notice { background: var(--notice-bg); border: 1px solid var(--notice-border); color: var(--notice-fg); }
      .notice a { color: inherit; font-weight: 600; }
      .fail { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-fg); }
      .fail[hidden], .notice[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">GStars</span>
      <button type="button" id="open-settings" class="icon-btn" aria-label="Open settings" title="Open settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 6L11 6M2 13L9 13M20 13L13 13M9 11L9 15M20 20L13 20M13 18L13 22"/>
          <path d="M19.5492 1.3739L20.1373 2.8648C20.3173 3.3213 20.6787 3.6827 21.1352 3.8627L22.6261 4.4508C22.8518 4.5397 23 4.7576 23 5C23 5.2424 22.8518 5.4603 22.6261 5.5492L21.1352 6.1373C20.6787 6.3173 20.3173 6.6787 20.1373 7.1352L19.5492 8.6261C19.4603 8.8518 19.2424 9 19 9C18.7576 9 18.5397 8.8518 18.4508 8.6261L17.8627 7.1352C17.6827 6.6787 17.3213 6.3173 16.8648 6.1373L15.3739 5.5492C15.1482 5.4603 15 5.2424 15 5C15 4.7576 15.1482 4.5397 15.3739 4.4508L16.8648 3.8627C17.3213 3.6827 17.6827 3.3213 17.8627 2.8648L18.4508 1.3739C18.5397 1.1482 18.7576 1 19 1C19.2424 1 19.4603 1.1482 19.5492 1.3739ZM4.8433 17.2337L5.2108 18.1655C5.3233 18.4508 5.5492 18.6767 5.8345 18.7892L6.7663 19.1567C6.9074 19.2123 7 19.3485 7 19.5C7 19.6515 6.9074 19.7877 6.7663 19.8433L5.8345 20.2108C5.5492 20.3233 5.3233 20.5492 5.2108 20.8345L4.8433 21.7663C4.7877 21.9074 4.6515 22 4.5 22C4.3485 22 4.2123 21.9074 4.1567 21.7663L3.7892 20.8345C3.6767 20.5492 3.4508 20.3233 3.1655 20.2108L2.2337 19.8433C2.0926 19.7877 2 19.6515 2 19.5C2 19.3485 2.0926 19.2123 2.2337 19.1567L3.1655 18.7892C3.4508 18.6767 3.6767 18.4508 3.7892 18.1655L4.1567 17.2337C4.2123 17.0926 4.3485 17 4.5 17C4.6515 17 4.7877 17.0926 4.8433 17.2337Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </header>
    <form id="form">
      <input id="username" placeholder="GitHub username" autocomplete="off" required />
      <button type="submit" id="submit">Confirm</button>
    </form>
    <p id="hint" class="notice" hidden>Keys are not configured. <a href="#" id="open-options">Open settings</a></p>
    <p id="error" class="fail" role="alert" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
