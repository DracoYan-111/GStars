<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>GStars Settings</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --card: #f6f8fa;
        --accent: #0969da;
        --accent-hover: #0860ca;
        --radius: 10px;
        --ok: #1a7f37;
        --fail: #d1242c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --card: #161b22;
          --accent: #4493f8;
          --accent-hover: #58a6ff;
          --ok: #3fb950;
          --fail: #ff7b72;
        }
      }
      * { box-sizing: border-box; }
      body {
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 560px;
        margin: 28px auto;
        padding: 0 20px 32px;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 20px; margin: 0 0 16px; letter-spacing: 0.1px; }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 12px;
        margin: 0 0 16px;
        padding: 6px 16px 14px;
        background: var(--card);
      }
      legend { padding: 0 8px; font-weight: 650; font-size: 13px; color: var(--muted); }
      label { display: block; margin: 12px 0 0; }
      .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-weight: 600; }
      .label-row a {
        flex: none;
        font-weight: 500;
        font-size: 13px;
        color: var(--accent);
        text-decoration: none;
      }
      .label-row a:hover { text-decoration: underline; }
      label small { display: block; margin-top: 2px; font-weight: 400; color: var(--muted); font-size: 12.5px; }
      input, select {
        width: 100%;
        padding: 8px 10px;
        margin-top: 6px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
      input.invalid { border: 1.5px solid var(--fail); outline-color: var(--fail); }
      input.invalid:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--fail) 20%, transparent); }
      button { padding: 8px 16px; font: inherit; font-weight: 600; border-radius: var(--radius); cursor: pointer; }
      button[type="submit"] { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
      button[type="submit"]:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      button[type="button"] { background: transparent; border: 1px solid var(--border); color: var(--fg); }
      button[type="button"]:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .row { display: flex; gap: 8px; align-items: center; }
      .result { margin: 8px 0 0; white-space: pre-wrap; font-size: 13px; }
      .ok { color: var(--ok); }
      .fail { color: var(--fail); }
    </style>
  </head>
  <body>
    <h1 id="page-title">GStars Settings</h1>
    <form id="form">
      <fieldset>
        <legend id="legend-keys">Keys (stored only in this browser)</legend>
        <label>
          <span class="label-row">
            <span>GitHub token</span>
            <a id="apply-github" href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">Get one</a>
          </span>
          <small id="hint-token">No permissions needed; only raises the API rate limit.</small>
          <input id="githubToken" type="password" autocomplete="off" />
        </label>
        <label>
          <span class="label-row">
            <span>Jev key (TypeSafe AI)</span>
            <a id="apply-jev" href="https://console.typesafe.ai/keys" target="_blank" rel="noopener">Get one</a>
          </span>
          <input id="jevKey" type="password" autocomplete="off" />
        </label>
      </fieldset>
      <fieldset>
        <legend id="legend-params">Parameters</legend>
        <label id="label-fullscan">Full-scan limit FULL_SCAN_LIMIT
          <small id="hint-fullscan">When repo count is within it, all are scored by Jev; otherwise only the top 200 keyword recalls are scored.</small>
          <input id="fullScanLimit" type="number" min="1" step="1" />
        </label>
        <label id="label-minscore">Minimum relevance MIN_SCORE (0–3)
          <small id="hint-minscore"></small>
          <input id="minScore" type="number" min="0" max="3" step="0.1" />
        </label>
        <label id="label-sync">Sync concurrency
          <small id="hint-sync"></small>
          <input id="syncConcurrency" type="number" min="1" max="32" step="1" />
        </label>
        <label id="label-jev">Jev scoring concurrency
          <small id="hint-jev"></small>
          <input id="jevConcurrency" type="number" min="1" max="64" step="1" />
        </label>
        <label id="label-locale">Language
          <small id="hint-locale"></small>
          <select id="locale">
            <option value="auto">Auto</option>
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </fieldset>
      <div class="row">
        <button type="submit" id="save">Save</button>
        <button type="button" id="test">Test connection</button>
      </div>
    </form>
    <p id="saved" class="result" role="status"></p>
    <p id="githubResult" class="result" role="status"></p>
    <p id="jevResult" class="result" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
